<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Wasit end-to-end customer journey</title><desc id="desc">Twelve connected stages from profile through work completion, with source checks and bilateral agreement changes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4338ca"/></marker></defs><rect width="1200" height="675" fill="#f8f9fc"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="27" font-weight="700" fill="#16224a">Wasit - end-to-end customer journey</text><text x="35" y="76" font-size="15" fill="#626c80">Five categories: 60/60 local HTTP stages passed. Hosted release verification is separate.</text><path d="M285 162H310" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 162H595" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M855 162H880" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1015 220V265" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M890 327H865" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M605 327H580" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M320 327H295" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M160 385V430" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M285 492H310" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 492H595" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M855 492H880" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="110" width="250" height="110" rx="18" fill="white" stroke="#d9dcf0"/><circle cx="63" cy="139" r="17" fill="#eef0ff"/><text x="63" y="145" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">0</text><text x="88" y="145" font-size="19" font-weight="700" fill="#16224a">Profile</text><text x="51" y="176" font-size="12" fill="#626c80">Private session and preferences</text><text x="51" y="203" font-size="12" font-weight="700" fill="#1f7a4d">Verified in the local API journey</text><rect x="320" y="110" width="250" height="110" rx="18" fill="white" stroke="#d9dcf0"/><circle cx="348" cy="139" r="17" fill="#eef0ff"/><text x="348" y="145" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">1</text><text x="373" y="145" font-size="19" font-weight="700" fill="#16224a">Request</text><text x="336" y="176" font-size="12" fill="#626c80">Describe work and a spending cap</text><text x="336" y="203" font-size="12" font-weight="700" fill="#1f7a4d">Verified in the local API journey</text><rect x="605" y="110" width="250" height="110" rx="18" fill="white" stroke="#d9dcf0"/><circle cx="633" cy="139" r="17" fill="#eef0ff"/><text x="633" y="145" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">2</text><text x="658" y="145" font-size="19" font-weight="700" fill="#16224a">Clarify</text><text x="621" y="176" font-size="12" fill="#626c80">Confirm missing hard facts</text><text x="621" y="203" font-size="12" font-weight="700" fill="#1f7a4d">Verified in the local API journey</text><rect x="890" y="110" width="250" height="110" rx="18" fill="white" stroke="#d9dcf0"/><circle cx="918" cy="139" r="17" fill="#eef0ff"/><text x="918" y="145" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">3</text><text x="943" y="145" font-size="19" font-weight="700" fill="#16224a">Discover</text><text x="906" y="176" font-size="12" fill="#626c80">Eligible consenting providers</text><text x="906" y="203" font-size="12" font-weight="700" fill="#1f7a4d">Verified in the local API journey</text><rect x="890" y="275" width="250" height="110" rx="18" fill="white" stroke="#d9dcf0"/><circle cx="918" cy="304" r="17" fill="#eef0ff"/><text x="918" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">4</text><text x="943" y="310" font-size="19" font-weight="700" fill="#16224a">Private RFQ</text><text x="906" y="341" font-size="12" fill="#626c80">Separate provider conversations</text><text x="906" y="368" font-size="12" font-weight="700" fill="#1f7a4d">Verified in the local API journey</text><rect x="605" y="275" width="250" height="110" rx="18" fill="white" stroke="#d9dcf0"/><circle cx="633" cy="304" r="17" fill="#eef0ff"/><text x="633" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">5</text><text x="658" y="310" font-size="19" font-weight="700" fill="#16224a">Negotiate</text><text x="621" y="341" font-size="12" fill="#626c80">Bounded actions and exact citations</text><text x="621" y="368" font-size="12" font-weight="700" fill="#1f7a4d">Verified in the local API journey</text><rect x="320" y="275" width="250" height="110" rx="18" fill="white" stroke="#d9dcf0"/><circle cx="348" cy="304" r="17" fill="#eef0ff"/><text x="348" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">6</text><text x="373" y="310" font-size="19" font-weight="700" fill="#16224a">Source-check</text><text x="336" y="341" font-size="12" fill="#626c80">Verify item, unit, price and message</text><text x="336" y="368" font-size="12" font-weight="700" fill="#1f7a4d">Verified in the local API journey</text><rect x="35" y="275" width="250" height="110" rx="18" fill="white" stroke="#d9dcf0"/><circle cx="63" cy="304" r="17" fill="#eef0ff"/><text x="63" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">7</text><text x="88" y="310" font-size="19" font-weight="700" fill="#16224a">Compare</text><text x="51" y="341" font-size="12" fill="#626c80">Equivalent scope; optional separate</text><text x="51" y="368" font-size="12" font-weight="700" fill="#1f7a4d">Verified in the local API journey</text><rect x="35" y="440" width="250" height="110" rx="18" fill="white" stroke="#d9dcf0"/><circle cx="63" cy="469" r="17" fill="#eef0ff"/><text x="63" y="475" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">8</text><text x="88" y="475" font-size="19" font-weight="700" fill="#16224a">Choose</text><text x="51" y="506" font-size="12" fill="#626c80">Review a current eligible quote</text><text x="51" y="533" font-size="12" font-weight="700" fill="#1f7a4d">Verified in the local API journey</text><rect x="320" y="440" width="250" height="110" rx="18" fill="white" stroke="#d9dcf0"/><circle cx="348" cy="469" r="17" fill="#eef0ff"/><text x="348" y="475" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">9</text><text x="373" y="475" font-size="19" font-weight="700" fill="#16224a">Agreement v1</text><text x="336" y="506" font-size="12" fill="#626c80">Both roles accept one version</text><text x="336" y="533" font-size="12" font-weight="700" fill="#1f7a4d">Verified in the local API journey</text><rect x="605" y="440" width="250" height="110" rx="18" fill="white" stroke="#d9dcf0"/><circle cx="633" cy="469" r="17" fill="#eef0ff"/><text x="633" y="475" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">10</text><text x="658" y="475" font-size="19" font-weight="700" fill="#16224a">On-site check</text><text x="621" y="506" font-size="12" fill="#626c80">Bill review, version 2 and top-up</text><text x="621" y="533" font-size="12" font-weight="700" fill="#1f7a4d">Verified in the local API journey</text><rect x="890" y="440" width="250" height="110" rx="18" fill="white" stroke="#d9dcf0"/><circle cx="918" cy="469" r="17" fill="#eef0ff"/><text x="918" y="475" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">11</text><text x="943" y="475" font-size="19" font-weight="700" fill="#16224a">Close work</text><text x="906" y="506" font-size="12" fill="#626c80">Complete, release, dispute, review</text><text x="906" y="533" font-size="12" font-weight="700" fill="#1f7a4d">Verified in the local API journey</text><text x="35" y="620" font-size="14" fill="#626c80">Quotes and negotiation repeat within bounded rounds. A new version requires both parties again.</text><text x="35" y="646" font-size="14" fill="#626c80">Demo providers and payments are simulations. History resumes owned records; Welcome never resets them.</text></g></svg>